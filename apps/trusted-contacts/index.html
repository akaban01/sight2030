<style>
  :root {
    --bg: #0a0a10;
    --fg: #f2f2f6;
    --muted: #9a9aac;
    --card: #14141f;
    --card-2: #191924;
    --border: #232334;
    --accent: #84cc16;
    --accent-2: #a3e635;
    color-scheme: dark;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f7fb;
      --fg: #14141c;
      --muted: #5b5b6d;
      --card: #ffffff;
      --card-2: #f3f3f9;
      --border: #e4e4ee;
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; min-height: 100%; }

  body {
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(50rem 34rem at 100% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 55%),
      var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: clamp(1.5rem, 6vw, 3.5rem) 1.25rem 4rem;
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.85rem;
    color: var(--muted);
    text-decoration: none;
    margin-bottom: 1.5rem;
  }
  .back:hover { color: var(--fg); }
  .back svg { width: 14px; height: 14px; }

  header {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    border-radius: 12px;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 8px 30px -8px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .mark svg { width: 22px; height: 22px; stroke: #0b0b12; }

  h1 {
    font-size: clamp(1.5rem, 4vw, 1.9rem);
    letter-spacing: -0.02em;
    margin: 0.1rem 0 0.4rem;
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.5;
    max-width: 46ch;
  }

  .search-wrap { position: relative; margin-bottom: 0.5rem; }
  .search-wrap svg {
    position: absolute;
    left: 0.95rem;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--muted);
    pointer-events: none;
  }
  #search {
    width: 100%;
    padding: 0.75rem 0.9rem 0.75rem 2.5rem;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--fg);
    font: inherit;
    font-size: 0.95rem;
    -webkit-appearance: none;
    appearance: none;
  }
  #search::placeholder { color: var(--muted); }
  #search::-webkit-search-cancel-button { -webkit-appearance: none; }
  #search:focus {
    outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
    outline-offset: 2px;
  }

  .meta {
    font-size: 0.82rem;
    color: var(--muted);
    margin: 0.75rem 0 1.75rem;
  }

  .cat {
    margin-bottom: 1.75rem;
  }
  .cat-title {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 0.6rem;
  }

  .rows {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.85rem 1rem;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--border);
  }

  .row-main { min-width: 0; }
  .row-name {
    font-weight: 600;
    font-size: 0.95rem;
    margin: 0 0 0.15rem;
    overflow-wrap: break-word;
  }
  .row-note {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.45;
    margin: 0;
  }
  .row-note.warn { color: #fb7185; }

  .contact-link {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 0.85rem;
    border-radius: 10px;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--fg);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .contact-link:hover { background: color-mix(in srgb, var(--accent) 26%, transparent); }
  .contact-link svg { width: 15px; height: 15px; color: var(--accent); flex-shrink: 0; }

  .no-results {
    display: none;
    text-align: center;
    color: var(--muted);
    padding: 3rem 1rem;
    font-size: 0.95rem;
  }
  .no-results.show { display: block; }

  footer {
    margin-top: 2.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--muted);
  }
  footer a { color: inherit; }
</style>

    function isEmail(s) { return /@/.test(s || ''); }

    function telHref(phone) {
      var digits = phone.replace(/\D/g, '');
      if (digits.length === 10) return 'tel:+1' + digits;
      if (digits.length === 11) return 'tel:+' + digits;
      return 'tel:' + digits;
    }

    function contactLink(contact) {
      if (!contact) return '';
      if (isEmail(contact)) {
        return '<a class="contact-link" href="mailto:' + contact + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>' +
          contact + '</a>';
      }
      return '<a class="contact-link" href="' + telHref(contact) + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4h3.5l1.5 5-2.5 1.5a12 12 0 0 0 6.5 6.5l1.5-2.5 5 1.5v3.5a2 2 0 0 1-2 2A16 16 0 0 1 2.5 6a2 2 0 0 1 2-2Z"/></svg>' +
        contact + '</a>';
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function groupByCategory(items) {
      var groups = {};
      items.forEach(function (item) {
        (groups[item.category] = groups[item.category] || []).push(item);
      });
      return Object.keys(groups).sort(function (a, b) { return a.localeCompare(b); })
        .map(function (cat) { return { category: cat, items: groups[cat] }; });
    }

    function render(items) {
      var list = document.getElementById('list');
      var noResults = document.getElementById('noResults');
      var meta = document.getElementById('meta');

      if (!items.length) {
        list.innerHTML = '';
        noResults.classList.add('show');
        meta.textContent = '';
        return;
      }
      noResults.classList.remove('show');

      var groups = groupByCategory(items);
      var cats = groups.length;
      meta.textContent = items.length + (items.length === 1 ? ' contact' : ' contacts') +
        ' across ' + cats + (cats === 1 ? ' category' : ' categories');

      list.innerHTML = groups.map(function (g) {
        var rows = g.items.map(function (item) {
          var noteClass = item.warn ? 'row-note warn' : 'row-note';
          var notesHtml = item.notes ? '<p class="' + noteClass + '">' + escapeHtml(item.notes) + '</p>' : '';
          return '<div class="row">' +
            '<div class="row-main"><p class="row-name">' + escapeHtml(item.name) + '</p>' + notesHtml + '</div>' +
            contactLink(item.contact) +
            '</div>';
        }).join('');
        return '<section class="cat"><p class="cat-title">' + escapeHtml(g.category) + '</p><div class="rows">' + rows + '</div></section>';
      }).join('');
    }

    var search = document.getElementById('search');
    search.addEventListener('input', function () {
      var q = search.value.trim().toLowerCase();
      if (!q) { render(CONTACTS); return; }
      var filtered = CONTACTS.filter(function (item) {
        var hay = (item.category + ' ' + item.name + ' ' + (item.notes || '')).toLowerCase();
        return hay.indexOf(q) !== -1;
      });
      render(filtered);
    });

    render(CONTACTS);
  </script>
