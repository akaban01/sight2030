<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>sight2030</title>
<meta name="description" content="A small workshop of free, focused, privacy-respecting web tools and sites — Faizan CMS, Exercise, PDF Forms, Todo, Image Converter, QR Studio, Stock Scanner, Skylight, NAMCC and Azkar." />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#0b0b12" />

<link rel="canonical" href="https://sight2030.com/" />
<meta name="robots" content="index, follow" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="sight2030" />
<meta property="og:title" content="sight2030" />
<meta property="og:description" content="A small workshop of free, focused, privacy-respecting web tools and sites." />
<meta property="og:url" content="https://sight2030.com/" />
<meta name="twitter:card" content="summary" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%2334d399'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230b0b12'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='url(%23g)' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='7' fill='url(%23g)'/%3E%3C/svg%3E" />

<style>
  :root {
    --bg: #0a0a10;
    --bg-2: #0f0f18;
    --fg: #f2f2f6;
    --muted: #9a9aac;
    --card: #14141f;
    --card-border: #232334;
    --ring: #34d399;
    --radius: 20px;
    color-scheme: dark;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f7fb;
      --bg-2: #eef0f6;
      --fg: #14141c;
      --muted: #5b5b6d;
      --card: #ffffff;
      --card-border: #e4e4ee;
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(60rem 40rem at 15% -10%, color-mix(in srgb, #7c3aed 22%, transparent), transparent 60%),
      radial-gradient(50rem 36rem at 110% 10%, color-mix(in srgb, #10b981 18%, transparent), transparent 55%),
      var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(28rem 28rem at var(--mx, 50%) var(--my, 20%), color-mix(in srgb, #a78bfa 10%, transparent), transparent 70%);
    transition: background 0.2s ease-out;
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 880px;
    margin: 0 auto;
    padding: clamp(3rem, 8vw, 6.5rem) 1.5rem 4rem;
  }

  header.hero {
    margin-bottom: clamp(2.5rem, 6vw, 4rem);
  }

  .mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #a78bfa, #34d399);
    margin-bottom: 1.5rem;
    box-shadow: 0 8px 30px -8px color-mix(in srgb, #34d399 60%, transparent);
  }
  .mark svg { width: 22px; height: 22px; }

  h1 {
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin: 0 0 0.9rem;
    font-weight: 700;
  }

  h1 .accent {
    background: linear-gradient(120deg, #a78bfa, #34d399 65%, #fbbf24);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .lede {
    font-size: clamp(1.05rem, 2.4vw, 1.25rem);
    line-height: 1.6;
    color: var(--muted);
    max-width: 46ch;
    margin: 0;
  }

  .section-label {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 1.1rem;
  }
  .section-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--card-border), transparent);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
  }

  @media (max-width: 620px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    padding: 1.5rem;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--card-border);
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(16rem 10rem at 0% 0%, var(--accent, transparent) 0%, transparent 70%);
    opacity: 0.16;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }

  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    border-color: color-mix(in srgb, var(--accent, #888) 55%, var(--card-border));
    box-shadow: 0 18px 40px -20px color-mix(in srgb, var(--accent, #000) 70%, transparent);
  }
  .card:hover::before, .card:focus-visible::before { opacity: 0.28; }
  .card:focus-visible { outline: 2px solid var(--accent, var(--ring)); outline-offset: 3px; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
  }

  .icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 11px;
    background: color-mix(in srgb, var(--accent, #888) 18%, transparent);
    color: var(--accent, var(--fg));
    flex-shrink: 0;
  }
  .icon svg { width: 20px; height: 20px; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.7rem;
    color: var(--muted);
    white-space: nowrap;
    padding-top: 0.5rem;
  }
  .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 0 3px color-mix(in srgb, #34d399 25%, transparent);
  }

  .card h2 {
    font-size: 1.15rem;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .card p {
    margin: 0;
    font-size: 0.92rem;
    line-height: 1.55;
    color: var(--muted);
    flex: 1;
  }

  .card .url {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--accent, var(--fg));
  }
  .card .url svg {
    width: 13px;
    height: 13px;
    transition: transform 0.2s ease;
  }
  .card:hover .url svg { transform: translate(2px, -2px); }

  footer {
    margin-top: clamp(3rem, 7vw, 5rem);
    padding-top: 1.75rem;
    border-top: 1px solid var(--card-border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    font-size: 0.85rem;
    color: var(--muted);
  }

  footer a { color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    .card, .glow, .card .url svg { transition: none; }
  }

  .fallback-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    gap: 0.6rem;
    font-size: 0.95rem;
  }
  .fallback-list a { color: var(--fg); font-weight: 600; }

  .grid-note {
    margin: 1rem 0 0;
    font-size: 0.9rem;
    color: var(--muted);
  }

  .status[data-status="beta"] .dot {
    background: #fbbf24;
    box-shadow: 0 0 0 3px color-mix(in srgb, #fbbf24 25%, transparent);
  }
  .status[data-status="soon"] .dot {
    background: var(--muted);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--muted) 25%, transparent);
  }

</style>
</head>
<body>
  <div class="glow" id="glow"></div>

  <main>
    <header class="hero">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="white" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="white"/></svg>
      </span>
      <h1>sight<span class="accent">2030</span></h1>
      <p class="lede">A small workshop of free, focused, privacy-respecting web tools and sites. No accounts, no tracking — most of them work fully offline.</p>
    </header>

    <section aria-labelledby="apps-label">
      <p class="section-label" id="apps-label">Apps</p>

      <div class="grid" id="grid" aria-busy="true"></div>

      <p class="grid-note" id="grid-note" hidden></p>

      <noscript>
        <ul class="fallback-list">
          <li><a href="https://editor.sight2030.com/">Faizan CMS</a> — editor.sight2030.com</li>
          <li><a href="https://exercise.sight2030.com/">Exercise</a> — exercise.sight2030.com</li>
          <li><a href="https://pdf-forms.sight2030.com/">PDF Forms</a> — pdf-forms.sight2030.com</li>
          <li><a href="https://todo.sight2030.com/">Todo</a> — todo.sight2030.com</li>
          <li><a href="https://img-proc.sight2030.com/">Image Converter</a> — img-proc.sight2030.com</li>
          <li><a href="https://qr.sight2030.com/">Prism QR Studio</a> — qr.sight2030.com</li>
          <li><a href="https://stocks.sight2030.com/">Stock Scanner</a> — stocks.sight2030.com</li>
          <li><a href="https://skylight.sight2030.com/">Skylight</a> — skylight.sight2030.com</li>
          <li><a href="https://namcc.sight2030.com/">NAMCC</a> — namcc.sight2030.com</li>
          <li><a href="https://zikr.sight2030.com/">Azkar</a> — zikr.sight2030.com</li>
        </ul>
      </noscript>
    </section>

    <footer>
      <span>&copy; <span id="year"></span> sight2030.com</span>
      <span>Built by <a href="https://github.com/akaban01" target="_blank" rel="noopener">akaban01</a></span>
    </footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Cards are rendered from data/apps.json so the list can be edited in
    // Pages CMS (https://app.pagescms.org) without touching this file.
    var ICONS = {
      beads: '<circle cx="12" cy="12" r="3"/><circle cx="5" cy="7" r="2"/><circle cx="19" cy="7" r="2"/><circle cx="5" cy="17" r="2"/><circle cx="19" cy="17" r="2"/><path d="M8.5 8.8 10 11M15.5 8.8 14 11M8.5 15.2 10 13M15.5 15.2 14 13"/>',
      dumbbell: '<path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/>',
      document: '<path d="M7 3.5h7l3.5 3.5V20a.5.5 0 0 1-.5.5H7a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5Z"/><path d="M14 3.5V7h3.5"/><path d="M9 13h6M9 16h4"/>',
      checklist: '<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5 11 15l5-5.5"/>',
      image: '<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M4 17l5-5 3.5 3.5L17 11l3 3"/>',
      qr: '<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="2.6" height="2.6"/><rect x="17.4" y="14" width="2.6" height="2.6"/><rect x="14" y="17.4" width="2.6" height="2.6"/><rect x="17.4" y="17.4" width="2.6" height="2.6"/>',
      chart: '<path d="M5 4v16M12 2v20M19 6v12"/><rect x="3.3" y="9" width="3.4" height="6" rx="0.6"/><rect x="10.3" y="6" width="3.4" height="9" rx="0.6"/><rect x="17.3" y="8" width="3.4" height="7" rx="0.6"/>',
      calendar: '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/><path d="M8.5 14.5l2 2 4.5-5"/>',
      home: '<path d="M4 20V9.5L12 4l8 5.5V20"/><path d="M9 20v-6h6v6"/><path d="M4 20h16"/>',
      layout: '<rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 9h17"/><path d="M9.5 9v11"/>',
      globe: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.2 2.4 3.4 5.4 3.4 8.5s-1.2 6.1-3.4 8.5c-2.2-2.4-3.4-5.4-3.4-8.5s1.2-6.1 3.4-8.5Z"/>',
      book: '<path d="M5 4h6.5A2.5 2.5 0 0 1 14 6.5V20a2 2 0 0 0-2-2H5Z"/><path d="M19 4h-2.5A2.5 2.5 0 0 0 14 6.5V20a2 2 0 0 1 2-2h3Z"/>',
      clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
      chat: '<path d="M20 15a2.5 2.5 0 0 1-2.5 2.5H9L4.5 21V6.5A2.5 2.5 0 0 1 7 4h10.5A2.5 2.5 0 0 1 20 6.5Z"/>',
      folder: '<path d="M3.5 7.5a2 2 0 0 1 2-2h3.4l2 2.5h7.6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/>',
      sparkle: '<path d="M12 3.5 13.9 9 19.5 11 13.9 13 12 18.5 10.1 13 4.5 11 10.1 9Z"/>'
    };

    var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';

    var STATUS_LABELS = { live: 'live', beta: 'beta', soon: 'coming soon' };

    function displayUrl(url) {
      try {
        var u = new URL(url);
        return (u.host + u.pathname).replace(/\/$/, '');
      } catch (e) {
        return url.replace(/^https?:\/\//, '').replace(/\/$/, '');
      }
    }

    function iconSvg(name) {
      var body = ICONS[name] || ICONS.globe;
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
        'stroke-linecap="round" stroke-linejoin="round">' + body + '</svg>';
    }

    function buildCard(app) {
      var card = document.createElement('a');
      card.className = 'card';
      card.href = app.url;
      card.target = '_blank';
      card.rel = 'noopener';
      if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(app.accent || '')) {
        card.style.setProperty('--accent', app.accent);
      }

      var top = document.createElement('div');
      top.className = 'card-top';

      var icon = document.createElement('span');
      icon.className = 'icon';
      icon.setAttribute('aria-hidden', 'true');
      icon.innerHTML = iconSvg(app.icon);

      var status = document.createElement('span');
      var key = STATUS_LABELS[app.status] ? app.status : 'live';
      status.className = 'status';
      status.setAttribute('data-status', key);
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.setAttribute('aria-hidden', 'true');
      status.appendChild(dot);
      status.appendChild(document.createTextNode(STATUS_LABELS[key]));

      top.appendChild(icon);
      top.appendChild(status);

      var title = document.createElement('h2');
      title.textContent = app.name;

      var desc = document.createElement('p');
      desc.textContent = app.description || '';

      var url = document.createElement('span');
      url.className = 'url';
      url.appendChild(document.createTextNode(displayUrl(app.url)));
      url.insertAdjacentHTML('beforeend', ARROW);

      card.appendChild(top);
      card.appendChild(title);
      card.appendChild(desc);
      card.appendChild(url);
      return card;
    }

    (function renderApps() {
      var grid = document.getElementById('grid');
      var note = document.getElementById('grid-note');

      function fail(message) {
        grid.removeAttribute('aria-busy');
        note.textContent = message;
        note.hidden = false;
      }

      fetch('data/apps.json', { cache: 'no-cache' })
        .then(function (res) {
          if (!res.ok) { throw new Error('HTTP ' + res.status); }
          return res.json();
        })
        .then(function (apps) {
          if (!Array.isArray(apps)) { throw new Error('apps.json must be an array'); }
          var visible = apps.filter(function (app) {
            return app && app.name && app.url && !app.hidden;
          });
          var frag = document.createDocumentFragment();
          visible.forEach(function (app) { frag.appendChild(buildCard(app)); });
          grid.appendChild(frag);
          grid.removeAttribute('aria-busy');
          if (!visible.length) { fail('No apps are listed yet.'); }
        })
        .catch(function (err) {
          console.error('Could not load data/apps.json:', err);
          fail('The app list could not be loaded. Please try again later.');
        });
    })();

    var root = document.documentElement;
    window.addEventListener('pointermove', function (e) {
      root.style.setProperty('--mx', e.clientX + 'px');
      root.style.setProperty('--my', e.clientY + 'px');
    }, { passive: true });
  </script>
</body>
</html>
